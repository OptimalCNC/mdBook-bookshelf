[package]
name = "mdbook-bookshelf"
version = "0.1.3"
edition = "2021"
description = "Build multi-book documentation sites on top of mdBook."
license = "MIT"
repository = "https://github.com/OptimalCNC/mdBook-bookshelf"
homepage = "https://github.com/OptimalCNC/mdBook-bookshelf"
readme = "README.md"
keywords = ["mdbook", "documentation", "bookshelf"]
categories = ["command-line-utilities"]
publish = ["crates-io"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/bookshelf.toml",
    "/cli/mdbook-bookshelf/src/**/*.rs",
    "/crates/mdbook-bookshelf/src/**/*.rs",
    "/docs/**/*.md",
    "/examples/**/*.md",
    "/examples/**/*.toml",
    "/tests/**/*.rs",
    "/tests/fixtures/**/*.css",
    "/tests/fixtures/**/*.md",
    "/tests/fixtures/**/*.toml",
    "!/examples/**/.mdbook/**",
    "!/tests/fixtures/**/.mdbook/**",
]

[lib]
name = "mdbook_bookshelf"
path = "crates/mdbook-bookshelf/src/lib.rs"

[[bin]]
name = "book"
path = "cli/mdbook-bookshelf/src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["wrap_help"] }
mdbook-driver = { version = "0.5.2", features = ["search"] }
mdbook-markdown = "0.5.2"
mdbook-preprocessor = "0.5.2"
mdbook-summary = "0.5.2"
pulldown-cmark-to-cmark = "22.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["net", "rt", "sync"] }
toml = "1.1.2"
tower-http = { version = "0.6.8", features = ["fs"] }
