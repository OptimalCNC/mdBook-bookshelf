[package]
name = "mdbook-bookshelf"
version = "0.1.0"
edition = "2021"

[lib]
name = "mdbook_bookshelf"
path = "src/lib.rs"

[[bin]]
name = "mdbook-bookshelf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8.8"
mdbook-driver = "0.5.2"
mdbook-summary = "0.5.2"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["net", "rt"] }
toml = "0.9"
tower-http = { version = "0.6.8", features = ["fs"] }
