[book]
title = "Core Docs"
authors = ["Ada Lovelace", "Grace Hopper"] # standard mdBook array field
description = "Root \"book\"." # escaped quote should parse by TOML semantics
src = "docs" # inline comment

[output.html]
default-theme = "light"
no-section-label = true # standard mdBook boolean field

[bookshelf]

[[bookshelf.book]]
id = "core"
title = "Core Docs"
description = "Root \"book\"."
src = "docs"

[[bookshelf.book]]
id = "parser"
title = "Parser Docs"
src = "modules/parser/docs"

[[bookshelf.category]]
title = "All Docs"
books = ["core", "parser"]
