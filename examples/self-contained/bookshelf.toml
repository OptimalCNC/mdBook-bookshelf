[book]
title = "Example Documentation"
description = "Example documentation portal."
language = "en"

[build]
build-dir = ".site"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"

[preprocessor.variables.variables]
ParserRoot = "/modules/parser/docs"
UiRoot = "/modules/ui/docs"

[bookshelf]
asset-dir = ".mdbook/bookshelf"

[[bookshelf.book]]
id = "core"
title = "Example Core"
description = "Repository-wide onboarding and architecture notes."
src = "docs"

[[bookshelf.book]]
id = "parser"
title = "Example Parser"
description = "Parser-specific reference pages with their own reading order."
src = "modules/parser/docs"

[[bookshelf.book]]
id = "ui"
title = "Example UI"
description = "Interface and runtime guides for the UI book."
src = "modules/ui/docs"

[[bookshelf.category]]
title = "Core"
books = ["core"]

[[bookshelf.category]]
title = "Modules"
books = ["parser", "ui"]
